name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_issue_automation:
    name: Release issue automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run release issue automation tests
        run: node .github/scripts/release-linked-issues.test.js

  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  build_windows_exe:
    name: Build Windows executable (${{ matrix.flavor }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, portable]

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install validators==0.22.0 pyinstaller==6.21.0

      - name: Build Windows executable
        shell: cmd
        run: build_windows.bat ${{ matrix.flavor }}

      - name: Smoke-test Windows executable
        shell: pwsh
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          $exeName = if ($env:FLAVOR -eq "standard") { "TwitchChannelPointsMiner.exe" } else { "TwitchChannelPointsMiner-Portable.exe" }
          # --windowed is a GUI-subsystem exe, so a plain call here returns
          # before the process actually finishes and leaves $LASTEXITCODE
          # stale/empty; Start-Process -Wait is needed to block on it and
          # get its real exit code.
          $proc = Start-Process -FilePath "dist\$exeName" -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Smoke test failed (exit code $($proc.ExitCode)) - the built exe is missing a GUI dependency"
          }

      - name: Upload built executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe-${{ matrix.flavor }}
          path: dist/TwitchChannelPointsMiner*.exe
          if-no-files-found: error

  windows_installer:
    name: Windows installer
    needs: build_windows_exe
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Download standard executable
        uses: actions/download-artifact@v8
        with:
          name: windows-exe-standard
          path: dist

      - name: Download portable executable
        uses: actions/download-artifact@v8
        with:
          name: windows-exe-portable
          path: dist

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler after installation"
          }
          & $compiler "/DMyAppVersion=0.0.0-pr${{ github.event.pull_request.number || github.run_number }}" "windows_installer.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ github.event.pull_request.number || github.run_number }}
          path: |
            dist/TwitchChannelPointsMiner.exe
            dist/TwitchChannelPointsMiner-Portable.exe
            dist/TwitchChannelPointsMiner-0.0.0-pr${{ github.event.pull_request.number || github.run_number }}-Setup.exe
          if-no-files-found: error
