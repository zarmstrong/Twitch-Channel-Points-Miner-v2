name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release_please:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release_retry_2.outputs.release_created || steps.release_retry_1.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.release_retry_2.outputs.tag_name || steps.release_retry_1.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        continue-on-error: true
        uses: googleapis/release-please-action@v5
        with:
          target-branch: master

      - name: Wait before retrying Release Please
        if: steps.release.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Retry Release Please
        if: steps.release.outcome == 'failure'
        id: release_retry_1
        continue-on-error: true
        uses: googleapis/release-please-action@v5
        with:
          target-branch: master

      - name: Wait before final Release Please attempt
        if: steps.release.outcome == 'failure' && steps.release_retry_1.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Run final Release Please attempt
        if: steps.release.outcome == 'failure' && steps.release_retry_1.outcome == 'failure'
        id: release_retry_2
        uses: googleapis/release-please-action@v5
        with:
          target-branch: master

  close_released_issues:
    name: Close released issues
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout released automation
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Close issues included in the release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        with:
          script: |
            const automation = require('./.github/scripts/release-linked-issues.js');
            await automation.closeReleasedIssues({
              github,
              context,
              core,
              tag: process.env.RELEASE_TAG,
            });

  publish_docker:
    name: Publish Docker image
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-docker.yml
    with:
      ref: ${{ needs.release_please.outputs.tag_name }}
    secrets: inherit

  publish_windows_exe:
    name: Publish Windows executable
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install validators==0.22.0 pyinstaller==6.21.0

      - name: Build Windows executable
        shell: cmd
        run: build_windows.bat

      - name: Package executable zip
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^Twitch-Channel-Points-Miner-v2-', ''
          $zipName = "TwitchChannelPointsMiner-$version.zip"
          Compress-Archive -Path "dist/TwitchChannelPointsMiner.exe" -DestinationPath "dist/$zipName" -Force
          "zip_path=dist/$zipName" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        id: installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^Twitch-Channel-Points-Miner-v2-', ''
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler after installation"
          }
          & $compiler "/DMyAppVersion=$version" "windows_installer.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "installer_path=dist/TwitchChannelPointsMiner-$version-Setup.exe" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_please.outputs.tag_name }}
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.installer.outputs.installer_path }}
          fail_on_unmatched_files: true
